<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Lineart Cleaner</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><h1>AI Lineart Cleaner</h1><p>画像を白背景・指定色の線のPNG線画へ変換します。しきい値以下の画素が線になります。</p>
<section class="controls"><label>画像を選択 <input id="image" type="file" accept="image/png,image/jpeg"></label><label for="threshold-range">しきい値 <input id="threshold-range" type="range" min="0" max="255" value="80" step="1"><input id="threshold-number" type="number" min="0" max="255" value="80" step="1"></label><label for="line-color">線色 <input id="line-color" type="color" value="#000000"><output id="line-color-value" for="line-color">#000000</output></label><div class="option"><label for="thin-line-assist"><input id="thin-line-assist" type="checkbox"> 薄い線を補助</label><p>薄くて背景に近い線を拾いやすくします。ノイズが増える場合があります。</p></div><div class="option"><label for="repair-strength">かすれ補完 <select id="repair-strength"><option value="0" selected>なし</option><option value="1">弱い</option><option value="2">やや強い</option></select></label><p>線の小さな欠けを補います。強くすると近い線がつながる場合があります。</p></div><button id="extract" type="button">線画化</button><span id="loading" hidden>処理中…</span><p id="error" role="alert"></p></section>
<section class="previews"><figure><figcaption>元画像</figcaption><img id="source-preview" alt="選択した元画像のプレビュー"></figure><figure><figcaption>抽出結果</figcaption><img id="result-preview" alt="抽出結果のプレビュー"><a id="download" hidden download="lineart.png">PNGを保存</a></figure></section>
</main><script src="/static/app.js"></script></body></html>
